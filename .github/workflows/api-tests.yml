# The server_url committed in tripleten_qa_api.postman_environment.json is a
# TripleTen Container Hub sandbox. That container responds HTTP 404 with
# "container is not found", and Newman fails every assertion against it.
# This workflow does not call that host.
#
# "Validate collection" parses the collection and environment. It sends no
# HTTP requests. "Newman live run" runs only when the repository variable
# SERVER_URL is a non-empty base URL. A skipped Newman job is not a passed
# API test run.

name: API tests

on:
  push:
    branches:
      - postman
  pull_request:
    branches:
      - postman
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate collection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Install Postman collection parser
        run: npm install --no-save --no-package-lock postman-collection@5.3.1

      - name: Parse collection and environment
        run: node scripts/validate-collection.js

      - name: Summarize
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
        run: |
          {
            echo "### Collection validation"
            echo ""
            echo "The Postman collection and environment parsed."
            if [ -z "${SERVER_URL}" ]; then
              echo ""
              echo "Newman did not run. The live run needs the repository variable \`SERVER_URL\` set to a reachable Urban Grocers base URL (Settings → Secrets and variables → Actions → Variables). The committed TripleTen sandbox URL is left unused. A green result on this job means the collection parsed."
            else
              echo ""
              echo "The Newman job calls the base URL stored in the \`SERVER_URL\` repository variable."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  newman:
    name: Newman live run
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ vars.SERVER_URL != '' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Install Newman
        run: npm install --no-save --no-package-lock newman@6.2.3 newman-reporter-htmlextra@1.23.1

      - name: Write CI environment from SERVER_URL
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
        run: node scripts/write-ci-environment.js

      - name: Run collection
        run: |
          mkdir -p reports
          npx --no-install newman run Urban.Grocers.postman_collection.json \
            --environment ci.postman_environment.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export reports/newman-report.html \
            --reporter-htmlextra-title "Urban Grocers" \
            --timeout-request 15000 \
            --color off

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: newman-html-report
          path: reports/newman-report.html
          if-no-files-found: error
